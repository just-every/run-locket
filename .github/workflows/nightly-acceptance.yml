name: Nightly acceptance

on:
  push:
    tags: ['v*']
  schedule:
    - cron: '56 2 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Browser acceptance (${{ matrix.shard }} of 8)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      # Retain controlled clocks and provider edges in the specs that declare
      # them. Native-only specs still use the owned installation's private entry.
      LOCKET_CAMPAIGN_LIVE: ''
    steps:
      - name: Set runner-owned browser cache
        run: printf 'PLAYWRIGHT_BROWSERS_PATH=%s/ms-playwright\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Make room for the native installation
        run: sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm config set store-dir "$RUNNER_TEMP/pnpm-store"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deps
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install chromium
      - name: Run every cited browser test in an owned local installation
        env:
          LOCKET_BROWSER_OUTPUT: ${{ runner.temp }}/locket-acceptance
        run: >-
          node tests/browser/campaign-live.mjs
          analytics.spec.ts approval-reminders.spec.ts audit.spec.ts
          browser-edits.spec.ts bulk-reminders.spec.ts clause-library.spec.ts
          clickwrap.spec.ts counterparties.spec.ts deadline-reminders.spec.ts
          entities.spec.ts families.spec.ts journey.spec.ts mobile-approval.spec.ts
          notice-agent-live.spec.ts notice-agent.spec.ts notices.spec.ts
          notifications-policy.spec.ts notifications.spec.ts obligation-evidence.spec.ts
          outcome-report.spec.ts playbook-recommendations.spec.ts portfolio.spec.ts
          remediation.spec.ts renewal-lifecycle.spec.ts reports.spec.ts review-redlines.spec.ts
          saved-views.spec.ts search.spec.ts service-levels.spec.ts service-performance.spec.ts
          signature-packets.spec.ts us-defaults.spec.ts --shard=${{ matrix.shard }}/8
      - name: Keep clause screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-acceptance-${{ matrix.shard }}
          path: ${{ runner.temp }}/locket-acceptance/screenshots
          if-no-files-found: warn
          retention-days: 7

  supporting-journeys:
    name: Acceptance (${{ matrix.journey }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - journey: intake-native
            command: node tests/browser/intake-form-live.mjs
          - journey: negotiation-native
            command: node tests/browser/browser-edits-live.mjs
          - journey: repository-scale
            command: node tests/browser/repository-bulk-scale.mjs
          - journey: word-open
            command: node tests/browser/word-template-open.mjs
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Set runner-owned browser cache
        run: printf 'PLAYWRIGHT_BROWSERS_PATH=%s/ms-playwright\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Make room for the native installation
        run: sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm config set store-dir "$RUNNER_TEMP/pnpm-store"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deps
      - run: pnpm exec playwright install chromium
        if: matrix.journey == 'intake-native' || matrix.journey == 'negotiation-native'
      - name: Install the actual Word document reader
        if: matrix.journey == 'word-open'
        run: |
          mkdir -p "$RUNNER_TEMP/rer-apt/archives"
          sudo apt-get update
          sudo apt-get -o "Dir::Cache::archives=$RUNNER_TEMP/rer-apt/archives" install --yes --no-install-recommends libreoffice-writer
      - name: Run the cited standalone journey
        env:
          LOCKET_BROWSER_OUTPUT: ${{ runner.temp }}/locket-acceptance
        run: ${{ matrix.command }}
      - name: Keep native clause screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acceptance-${{ matrix.journey }}
          path: ${{ runner.temp }}/locket-acceptance/screenshots
          if-no-files-found: ignore
          retention-days: 7
