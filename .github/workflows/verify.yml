name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.partition }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The API runner shards the complete existing file list. The portable
        # export/import proof gets its own runner; no checks move off push CI.
        partition: [core, api-1, api-2, api-3, api-4, portable]
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; action runtime Node 24
        with:
          persist-credentials: false
      - name: Reclaim unused hosted runner toolchain space
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        shell: bash
        run: |
          # rer dev (the export/import proof) requires 15 GiB free. This JavaScript
          # job does not use Android, .NET or Haskell; Node, browsers and caches stay.
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; action runtime Node 24
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deps
      # Ubuntu 24.04's hosted image includes Chrome's system libraries. Cache
      # only the exact browser build selected by the locked Playwright package;
      # hydration still launches that browser in the core verification job.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: matrix.partition == 'core'
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install chromium
        if: matrix.partition == 'core'
      - run: pnpm exec rer check --profile first-party
      - name: Check generated contract documents
        if: matrix.partition == 'core'
        run: node src/base/contract-docs.mjs check
      - name: Check edition source lock freshness
        if: matrix.partition == 'core'
        run: node scripts/edition-authoring/cli.mjs check > /dev/null
      - name: Run full verification partition
        run: node .github/scripts/verify.mjs "${{ matrix.partition }}"
      - name: Prove commercial handoffs at both widths
        if: matrix.partition == 'core'
        run: |
          LOCKET_SCREENSHOTS="${RUNNER_TEMP}/locket-commercial" node tests/browser/proposal-pricing-journey.mjs
          LOCKET_SCREENSHOTS="${RUNNER_TEMP}/locket-commercial" pnpm exec playwright test --config tests/browser/playwright.config.ts notices.spec.ts --grep 'LINK-001' --workers=1
      - name: Prove native obligation lifecycle and owner lists
        if: matrix.partition == 'core'
        run: LOCKET_SCREENSHOTS="${{ runner.temp }}/locket-obligations" pnpm exec playwright test --config tests/browser/playwright.config.ts obligation-evidence.spec.ts --workers=1
      - name: Keep native obligation screens
        if: matrix.partition == 'core'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-obligation-screens
          path: ${{ runner.temp }}/locket-obligations
      - name: Prove model settings and records at both widths
        if: matrix.partition == 'core'
        run: LOCKET_SCREENSHOTS="${{ runner.temp }}/locket-models" node tests/browser/model-settings-journey.mjs
      - name: Prove execution retrieval at both widths
        if: matrix.partition == 'core'
        run: LOCKET_SCREENSHOTS="${{ runner.temp }}/locket-execution" pnpm exec playwright test --config tests/browser/playwright.config.ts execution-comparison.spec.ts --grep 'AGENT-006 changed signed liability' --workers=1
      - name: Keep execution retrieval screens
        if: matrix.partition == 'core'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: execution-retrieval-screens
          path: ${{ runner.temp }}/locket-execution
      - name: Keep model and summary screens
        if: matrix.partition == 'core'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: model-and-summary-screens
          path: ${{ runner.temp }}/locket-models
